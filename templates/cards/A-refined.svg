<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FD"/>
      <stop offset="1" stop-color="#ECE9F8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#534AB7"/>
      <stop offset="1" stop-color="#9E97E8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#534AB7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 页面背景：淡紫渐变 -->
  <rect width="680" height="520" fill="url(#bgGrad)"/>

  <!-- 卡片主体：白卡 + 柔和投影 -->
  <rect x="60" y="30" width="560" height="460" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 日期贴纸：右上角，微倾斜 -->
  <g transform="rotate(3 534 67)">
    <rect x="478" y="52" width="112" height="30" rx="15" fill="#534AB7"/>
    <text x="534" y="72" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">6月18日</text>
  </g>

  <!-- 标题：衬线大字 -->
  <text x="340" y="118" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="32" fill="#26215C" text-anchor="middle">Pull someone's leg</text>
  <!-- 音标 -->
  <text x="340" y="146" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#9C9A92" text-anchor="middle">/pʊl ˈsʌmwʌnz leɡ/</text>
  <!-- 标题下渐变强调条 -->
  <rect x="295" y="158" width="90" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- 分隔线 -->
  <line x1="100" y1="182" x2="580" y2="182" stroke="#E4E2F0" stroke-width="1"/>

  <!-- 含义：浅色底 + 彩色文字的胶囊 -->
  <rect x="92" y="200" width="64" height="26" rx="13" fill="#EFEDFB"/>
  <text x="124" y="217" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#534AB7" text-anchor="middle">含义</text>
  <text x="172" y="217" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33314E">开玩笑；愚弄；戏弄。朋友间轻松的调侃。</text>

  <!-- 例句 -->
  <rect x="92" y="246" width="64" height="26" rx="13" fill="#E1F5EE"/>
  <text x="124" y="263" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#0F6E56" text-anchor="middle">例句</text>
  <text x="172" y="263" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33314E">"You're <tspan font-weight="700" fill="#0F6E56">pulling my leg</tspan>, right?"（你在逗我吧？）</text>
  <text x="172" y="279" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33314E">"I was just <tspan font-weight="700" fill="#0F6E56">pulling your leg</tspan>."（我刚开玩笑的。）</text>

  <!-- 来源 -->
  <rect x="92" y="308" width="64" height="26" rx="13" fill="#FAEEDA"/>
  <text x="124" y="325" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#A86B14" text-anchor="middle">来源</text>
  <text x="172" y="325" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33314E">19世纪英国，最早见于1811年文献，源于恶作剧拉腿绊倒。</text>

  <!-- 记忆 -->
  <rect x="92" y="362" width="64" height="26" rx="13" fill="#FAECE7"/>
  <text x="124" y="379" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#C24E2A" text-anchor="middle">记忆</text>
  <text x="172" y="379" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33314E">朋友讲笑话时伸手拉你裤脚 → pull=拉，leg=腿 → 拉腿=开玩笑。</text>

  <!-- 页脚：两侧细线装饰 -->
  <line x1="140" y1="458" x2="235" y2="458" stroke="#E4E2F0" stroke-width="1"/>
  <line x1="445" y1="458" x2="540" y2="458" stroke="#E4E2F0" stroke-width="1"/>
  <text x="340" y="462" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9C9A92" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
