<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8A8478" flood-opacity="0.25"/>
    </filter>
    <pattern id="ruled" width="26" height="26" patternUnits="userSpaceOnUse">
      <line x1="0" y1="25" x2="26" y2="25" stroke="#D8E2EC" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 桌面底 -->
  <rect width="680" height="520" fill="#F2EFE9"/>

  <!-- 纸张 -->
  <rect x="70" y="30" width="540" height="460" rx="4" fill="#FDFDFB" filter="url(#paperShadow)"/>

  <!-- 横线（26px 网格，所有文字基线压在横线上） -->
  <rect x="85" y="62" width="510" height="410" fill="url(#ruled)"/>

  <!-- 红色 margin 竖线 -->
  <line x1="140" y1="42" x2="140" y2="478" stroke="#EFA8B8" stroke-width="1.5"/>

  <!-- 左侧三个打孔（半探出纸缘） -->
  <circle cx="78" cy="140" r="9" fill="#F2EFE9" stroke="#E0DCD2" stroke-width="1"/>
  <circle cx="78" cy="280" r="9" fill="#F2EFE9" stroke="#E0DCD2" stroke-width="1"/>
  <circle cx="78" cy="420" r="9" fill="#F2EFE9" stroke="#E0DCD2" stroke-width="1"/>

  <!-- 日期：红笔字右上 -->
  <text x="585" y="70" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" font-size="13" fill="#C2553B" text-anchor="end">6月18日</text>

  <!-- 标题：蓝黑钢笔字，基线压线 -->
  <text x="155" y="108" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="30" fill="#1F3A6E">Pull someone's leg</text>
  <!-- 音标 -->
  <text x="155" y="134" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#7A869A">/pʊl ˈsʌmwʌnz leɡ/</text>

  <!-- 含义：margin 左侧红笔标签 -->
  <text x="92" y="186" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="11" fill="#C2553B">含义</text>
  <text x="155" y="186" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">开玩笑；愚弄；戏弄。朋友间轻松的调侃。</text>

  <!-- 例句：俗语红笔加粗 -->
  <text x="92" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="11" fill="#C2553B">例句</text>
  <text x="155" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">"You're <tspan font-weight="700" fill="#C2553B">pulling my leg</tspan>, right?"（你在逗我吧？）</text>
  <text x="155" y="238" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">"I was just <tspan font-weight="700" fill="#C2553B">pulling your leg</tspan>."（我刚开玩笑的。）</text>

  <!-- 来源 -->
  <text x="92" y="264" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="11" fill="#C2553B">来源</text>
  <text x="155" y="264" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">19世纪英国，最早见于1811年文献，源于恶作剧拉腿绊倒。</text>

  <!-- 记忆：两行 -->
  <text x="92" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="11" fill="#C2553B">记忆</text>
  <text x="155" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">朋友讲笑话时伸手拉你裤脚 →</text>
  <text x="155" y="316" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B3A4E">pull=拉，leg=腿 → 拉腿=开玩笑。</text>

  <!-- 页脚：白底盖线 -->
  <rect x="250" y="436" width="180" height="15" fill="#FDFDFB"/>
  <text x="340" y="447" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#9AA5B1" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
