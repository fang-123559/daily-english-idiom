<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <!-- 旧报纸底色 -->
  <rect width="680" height="520" fill="#EFE8D8"/>

  <!-- 卡片：双线框 -->
  <rect x="55" y="30" width="570" height="460" fill="#FBF6E9" stroke="#2B2620" stroke-width="2"/>
  <rect x="63" y="38" width="554" height="444" fill="none" stroke="#2B2620" stroke-width="1"/>

  <!-- 报头行：左刊号右日期 -->
  <text x="85" y="66" font-family="Georgia,'Times New Roman',serif" font-size="10" letter-spacing="2" fill="#6B6155">VOL. 01</text>
  <text x="595" y="66" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6B6155" text-anchor="end">6月18日</text>
  <!-- 报头双细线 -->
  <line x1="85" y1="76" x2="595" y2="76" stroke="#2B2620" stroke-width="2"/>
  <line x1="85" y1="80" x2="595" y2="80" stroke="#2B2620" stroke-width="1"/>

  <!-- 标题 -->
  <text x="340" y="126" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="32" fill="#1F1B16" text-anchor="middle">Pull someone's leg</text>
  <!-- 音标：斜体 -->
  <text x="340" y="152" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#6B6155" text-anchor="middle">/pʊl ˈsʌmwʌnz leɡ/</text>
  <!-- 红色强调条：全卡唯一点缀色 -->
  <rect x="315" y="164" width="50" height="3" fill="#B4443C"/>

  <!-- 分隔线 -->
  <line x1="100" y1="186" x2="580" y2="186" stroke="#8A8070" stroke-width="1"/>

  <!-- 含义：黑方块 + 加粗标签，单色印刷感 -->
  <rect x="92" y="206" width="10" height="10" fill="#2B2620"/>
  <text x="110" y="215" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="13" fill="#1F1B16">含义</text>
  <text x="172" y="215" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B2620">开玩笑；愚弄；戏弄。朋友间轻松的调侃。</text>

  <!-- 例句：俗语加粗 + 下划线，不用彩色 -->
  <rect x="92" y="252" width="10" height="10" fill="#2B2620"/>
  <text x="110" y="261" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="13" fill="#1F1B16">例句</text>
  <text x="172" y="261" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B2620">"You're <tspan font-weight="700" text-decoration="underline">pulling my leg</tspan>, right?"（你在逗我吧？）</text>
  <text x="172" y="277" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B2620">"I was just <tspan font-weight="700" text-decoration="underline">pulling your leg</tspan>."（我刚开玩笑的。）</text>

  <!-- 来源 -->
  <rect x="92" y="314" width="10" height="10" fill="#2B2620"/>
  <text x="110" y="323" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="13" fill="#1F1B16">来源</text>
  <text x="172" y="323" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B2620">19世纪英国，最早见于1811年文献，源于恶作剧拉腿绊倒。</text>

  <!-- 记忆 -->
  <rect x="92" y="368" width="10" height="10" fill="#2B2620"/>
  <text x="110" y="377" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="13" fill="#1F1B16">记忆</text>
  <text x="172" y="377" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2B2620">朋友讲笑话时伸手拉你裤脚 → pull=拉，leg=腿 → 拉腿=开玩笑。</text>

  <!-- 页脚 -->
  <line x1="140" y1="452" x2="235" y2="452" stroke="#8A8070" stroke-width="1"/>
  <line x1="445" y1="452" x2="540" y2="452" stroke="#8A8070" stroke-width="1"/>
  <text x="340" y="456" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B6155" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
