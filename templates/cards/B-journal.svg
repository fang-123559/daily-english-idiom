<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <!-- 页面背景：奶油色 -->
  <rect width="680" height="520" fill="#FBF3E4"/>

  <!-- 卡片主体 -->
  <rect x="55" y="35" width="570" height="450" rx="18" fill="#FFFDF8" stroke="#E8DCC3" stroke-width="1.5"/>

  <!-- 内层虚线框：手账感 -->
  <rect x="70" y="50" width="540" height="420" rx="12" fill="none" stroke="#E3D5B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- 和纸胶带贴角 -->
  <rect x="95" y="22" width="90" height="26" rx="3" fill="#F2C14E" opacity="0.8" transform="rotate(-6 140 35)"/>
  <rect x="495" y="22" width="90" height="26" rx="3" fill="#A9C8A9" opacity="0.8" transform="rotate(5 540 35)"/>

  <!-- 日期印章：右上角斜贴 -->
  <g transform="rotate(-7 542 84)">
    <rect x="500" y="68" width="84" height="32" rx="8" fill="#D85A30"/>
    <text x="542" y="89" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">6月18日</text>
  </g>

  <!-- 左上角涂鸦星星 -->
  <path d="M0,-8 C1.4,-2 2,-1.4 8,0 C2,1.4 1.4,2 0,8 C-1.4,2 -2,1.4 -8,0 C-2,-1.4 -1.4,-2 0,-8 Z" transform="translate(120,88)" fill="#F2C14E"/>
  <circle cx="140" cy="105" r="3" fill="#A9C8A9"/>

  <!-- 标题 -->
  <text x="330" y="126" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="30" fill="#4A3F30" text-anchor="middle">Pull someone's leg</text>
  <!-- 手绘波浪下划线 -->
  <path d="M 235 140 q 12 8 25 0 t 25 0 t 25 0 t 25 0 t 25 0 t 25 0" stroke="#E8A33D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 音标 -->
  <text x="330" y="168" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#A89B85" text-anchor="middle">/pʊl ˈsʌmwʌnz leɡ/</text>

  <!-- 含义 -->
  <rect x="92" y="196" width="76" height="26" rx="13" fill="#FCE4D6"/>
  <text x="130" y="213" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#C05B2E" text-anchor="middle">📖 含义</text>
  <text x="180" y="213" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4A3F30">开玩笑；愚弄；戏弄。朋友间轻松的调侃。</text>

  <!-- 例句 -->
  <rect x="92" y="242" width="76" height="26" rx="13" fill="#E2EFE0"/>
  <text x="130" y="259" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#4E7A3F" text-anchor="middle">💬 例句</text>
  <text x="180" y="259" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4A3F30">"You're <tspan font-weight="700" fill="#4E7A3F">pulling my leg</tspan>, right?"（你在逗我吧？）</text>
  <text x="180" y="275" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4A3F30">"I was just <tspan font-weight="700" fill="#4E7A3F">pulling your leg</tspan>."（我刚开玩笑的。）</text>

  <!-- 来源 -->
  <rect x="92" y="304" width="76" height="26" rx="13" fill="#FBEFD2"/>
  <text x="130" y="321" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#A8791F" text-anchor="middle">🌍 来源</text>
  <text x="180" y="321" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4A3F30">19世纪英国，最早见于1811年文献，源于恶作剧拉腿绊倒。</text>

  <!-- 记忆 -->
  <rect x="92" y="358" width="76" height="26" rx="13" fill="#E4EEF6"/>
  <text x="130" y="375" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" font-size="12" fill="#46688C" text-anchor="middle">🧠 记忆</text>
  <text x="180" y="375" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4A3F30">朋友讲笑话时伸手拉你裤脚 → pull=拉，leg=腿 → 拉腿=开玩笑。</text>

  <!-- 底部涂鸦点缀 -->
  <circle cx="220" cy="440" r="2.5" fill="#E8DCC3"/>
  <circle cx="235" cy="440" r="2.5" fill="#E3D5B8"/>
  <path d="M0,-6 C1,-1.5 1.5,-1 6,0 C1.5,1 1,1.5 0,6 C-1,1.5 -1.5,1 -6,0 C-1.5,-1 -1,-1.5 0,-6 Z" transform="translate(470,438)" fill="#F2C14E"/>

  <!-- 页脚 -->
  <text x="340" y="452" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#B4A68C" text-anchor="middle">每日一俗语 · 让英语融入生活 ✎</text>
</svg>
