<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <!-- 卡片主体 -->
  <rect x="40" y="20" width="600" height="480" rx="16" fill="#F8F7FE" stroke="#534AB7" stroke-width="1.5"/>
  <!-- 日期胶囊 -->
  <rect x="70" y="45" width="100" height="28" rx="14" fill="#534AB7"/>
  <text x="120" y="64" font-family="sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">6月20日</text>
  <!-- 标题 -->
  <text x="340" y="110" font-family="sans-serif" font-weight="600" font-size="28" fill="#26215C" text-anchor="middle">The squeaky wheel gets the grease</text>
  <!-- 音标 -->
  <text x="340" y="140" font-family="sans-serif" font-weight="400" font-size="14" fill="#888780" text-anchor="middle">/ðə ˈskwiːki wiːl ɡets ðə ɡriːs/</text>
  <!-- 分隔线 -->
  <line x1="70" y1="165" x2="610" y2="165" stroke="#534AB7" stroke-width="1" stroke-opacity="0.3"/>
  <!-- 含义 -->
  <rect x="100" y="203" width="60" height="26" rx="6" fill="#7F77DD"/>
  <text x="130" y="221" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">含义</text>
  <text x="145" y="222" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">会哭的孩子有奶吃；主动争取才能获得帮助。</text>
  <!-- 例句 -->
  <rect x="100" y="248" width="60" height="26" rx="6" fill="#0F6E56"/>
  <text x="130" y="266" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">例句</text>
  <text x="145" y="267" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"The <tspan font-weight="700" fill="#0F6E56">squeaky wheel gets the grease</tspan>, so speak up."（主动反馈才能被关注。）</text>
  <text x="145" y="283" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"Don't wait silently — the <tspan font-weight="700" fill="#0F6E56">squeaky wheel gets the grease</tspan>."（别默默等待，要主动发声。）</text>
  <!-- 来源 -->
  <rect x="100" y="313" width="60" height="26" rx="6" fill="#BA7517"/>
  <text x="130" y="331" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">来源</text>
  <text x="145" y="332" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">19世纪美国西部牛仔时代，马车轮缺油吱吱作响优先上油，1900年左右报刊记载。</text>
  <!-- 记忆 -->
  <rect x="100" y="378" width="60" height="26" rx="6" fill="#D85A30"/>
  <text x="130" y="396" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">记忆</text>
  <text x="145" y="397" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">吱吱作响的马车轮子最先被涂油 → 主动发声 = 获得资源。</text>
  <!-- 页脚 -->
  <text x="340" y="475" font-family="sans-serif" font-weight="400" font-size="12" fill="#888780" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
