<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <!-- 卡片主体 -->
  <rect x="40" y="20" width="600" height="480" rx="16" fill="#F8F7FE" stroke="#534AB7" stroke-width="1.5"/>
  <!-- 日期胶囊 -->
  <rect x="70" y="45" width="100" height="28" rx="14" fill="#534AB7"/>
  <text x="120" y="64" font-family="sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">6月23日</text>
  <!-- 标题（较长，分两行渲染） -->
  <text x="340" y="102" font-family="sans-serif" font-weight="600" font-size="26" fill="#26215C" text-anchor="middle">Don't count your chickens</text>
  <text x="340" y="134" font-family="sans-serif" font-weight="600" font-size="26" fill="#26215C" text-anchor="middle">before they hatch</text>
  <!-- 音标 -->
  <text x="340" y="160" font-family="sans-serif" font-weight="400" font-size="14" fill="#888780" text-anchor="middle">/dəʊnt kaʊnt jɔː ˈtʃɪkɪnz bɪˈfɔː ðeɪ hætʃ/</text>
  <!-- 分隔线 -->
  <line x1="70" y1="180" x2="610" y2="180" stroke="#534AB7" stroke-width="1" stroke-opacity="0.3"/>
  <!-- 含义 -->
  <rect x="100" y="215" width="60" height="26" rx="6" fill="#7F77DD"/>
  <text x="130" y="233" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">含义</text>
  <text x="170" y="234" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">别高兴太早；不要过早乐观；别指望还没到手的东西。</text>
  <!-- 例句 -->
  <rect x="100" y="258" width="60" height="26" rx="6" fill="#0F6E56"/>
  <text x="130" y="276" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">例句</text>
  <text x="170" y="277" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"Don't <tspan font-weight="700" fill="#0F6E56">count your chickens before they hatch</tspan>."（别高兴太早。）</text>
  <text x="170" y="293" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"Don't <tspan font-weight="700" fill="#0F6E56">count your chickens</tspan> yet."（别高兴太早。）</text>
  <!-- 来源 -->
  <rect x="100" y="318" width="60" height="26" rx="6" fill="#BA7517"/>
  <text x="130" y="336" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">来源</text>
  <text x="170" y="337" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">伊索寓言《挤牛奶的女孩》（约公元前600年），1570年代英语文献记载。</text>
  <!-- 记忆 -->
  <rect x="100" y="378" width="60" height="26" rx="6" fill="#D85A30"/>
  <text x="130" y="396" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">记忆</text>
  <text x="170" y="397" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">农妇头顶牛奶桶幻想发财，洒了一地 → count=数小鸡，hatch=孵化。</text>
  <!-- 页脚 -->
  <text x="340" y="475" font-family="sans-serif" font-weight="400" font-size="12" fill="#888780" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
