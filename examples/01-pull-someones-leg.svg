<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <!-- 卡片主体 -->
  <rect x="40" y="20" width="600" height="480" rx="16" fill="#F8F7FE" stroke="#534AB7" stroke-width="1.5"/>
  <!-- 日期胶囊 -->
  <rect x="70" y="45" width="100" height="28" rx="14" fill="#534AB7"/>
  <text x="120" y="64" font-family="sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">6月18日</text>
  <!-- 标题 -->
  <text x="340" y="110" font-family="sans-serif" font-weight="600" font-size="28" fill="#26215C" text-anchor="middle">Pull someone's leg</text>
  <!-- 音标 -->
  <text x="340" y="140" font-family="sans-serif" font-weight="400" font-size="14" fill="#888780" text-anchor="middle">/pʊl ˈsʌmwʌnz leɡ/</text>
  <!-- 分隔线 -->
  <line x1="70" y1="165" x2="610" y2="165" stroke="#534AB7" stroke-width="1" stroke-opacity="0.3"/>
  <!-- 含义 -->
  <rect x="100" y="203" width="60" height="26" rx="6" fill="#7F77DD"/>
  <text x="130" y="221" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">含义</text>
  <text x="170" y="222" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">开玩笑；愚弄；戏弄。朋友间轻松的调侃。</text>
  <!-- 例句 -->
  <rect x="100" y="248" width="60" height="26" rx="6" fill="#0F6E56"/>
  <text x="130" y="266" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">例句</text>
  <text x="170" y="267" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"You're <tspan font-weight="700" fill="#0F6E56">pulling my leg</tspan>, right?"（你在逗我吧？）</text>
  <text x="170" y="283" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">"I was just <tspan font-weight="700" fill="#0F6E56">pulling your leg</tspan>."（我刚开玩笑的。）</text>
  <!-- 来源 -->
  <rect x="100" y="313" width="60" height="26" rx="6" fill="#BA7517"/>
  <text x="130" y="331" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">来源</text>
  <text x="170" y="332" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">19世纪英国，最早见于1811年文献，源于恶作剧拉腿绊倒。</text>
  <!-- 记忆 -->
  <rect x="100" y="378" width="60" height="26" rx="6" fill="#D85A30"/>
  <text x="130" y="396" font-family="sans-serif" font-weight="500" font-size="12" fill="#FFFFFF" text-anchor="middle">记忆</text>
  <text x="170" y="397" font-family="sans-serif" font-weight="400" font-size="13" fill="#26215C">朋友讲笑话时伸手拉你裤脚 → pull=拉，leg=腿 → 拉腿=开玩笑。</text>
  <!-- 页脚 -->
  <text x="340" y="475" font-family="sans-serif" font-weight="400" font-size="12" fill="#888780" text-anchor="middle">每日一俗语 · 让英语融入生活</text>
</svg>
